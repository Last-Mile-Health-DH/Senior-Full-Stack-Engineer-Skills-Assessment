services:
  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      restart: always
      env_file:
        - .env
      environment:
        - DATABASE_URL=postgresql://postgres:postgres@relational_db:5432/postgres
      ports:
        - "6100:6100"
      depends_on:
        - relational_db

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      restart: always
      ports:
        - "3000:3000"
      depends_on:
        - backend

  chainlit:
      build:
        context: ./chainlit
        dockerfile: Dockerfile
      restart: always
      environment:
        - BACKEND_API_BASE_URL=http://backend:6100
      ports:
        - "8000:8000"
      depends_on:
        - backend

  relational_db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_volume:
