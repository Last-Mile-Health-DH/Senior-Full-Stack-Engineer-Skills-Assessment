services:
  backend:
      build:
        context: ./backend_old
        dockerfile: Dockerfile
      restart: always
      ports:
        - "6100:6100"

  frontend:
      build:
        context: ./frontend_old
        dockerfile: Dockerfile
      command: npm start
      restart: always
      environment:
        - BACKEND_URL=http://backend:6100
      ports:
        - "3000:3000"

  # chainlit:
  #     build:
  #       context: ./chainlit_app_old
  #       dockerfile: Dockerfile
  #     restart: always
  #     ports:
  #       - "8000:8000"

  relational_db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_volume:
