[project]
name = "chainlit-ui"
version = "0.1.0"
description = "Chainlit chat UI — thin client over the FastAPI backend's /chat endpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
