[project]
name = "backend"
version = "0.1.0"
description = "FastAPI RAG backend (ingestion + chat) for the Last Mile Health assessment"
readme = "README.md"
authors = [
    { name = "Daudi", email = "dakn2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "openai>=1.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pdfplumber==0.11.10",
    "langchain==1.3.13",
    "langchain-experimental==0.4.2",
    "langchain-openai==1.3.5",
    "sentence-transformers==5.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres+pgvector instance and OPENAI_API_KEY",
]
